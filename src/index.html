<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Decode, encode, draw and edit polylines on a map. Encoded polyline (precision 5 or 6), LatLng and LngLat arrays and GeoJSON, all in sync." />
    <meta name="keywords" content="polyline, encoded polyline, decoder, encoder, editor, GeoJSON, map" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Polyline Visualizer: decode, draw and edit polylines</title>
    <script>
      // Apply the saved theme before first paint (mirrors src/lib/theme.ts).
      try {
        var pref = localStorage.getItem('pv-theme');
        if (pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <style>
      /* Self-hosted variable fonts (latin + latin-ext), served from /fonts. See src/assets.ts. */
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-ext-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
      }

        unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
